<div class="page-center">
    <div class="register-container">

        <h2>Create Your Account</h2>

        <div *ngIf="errorMessage" class="error-message">
            <strong>Error:</strong> {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" ngNativeValidate>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       [(ngModel)]="username" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       [(ngModel)]="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       [(ngModel)]="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirmPassword"
                       [(ngModel)]="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="register-btn-main">Sign Up</button>

        </form>

        <div class="extra-links">
            <p>Already have an account? <a routerLink="/login">Login</a></p>
        </div>

    </div>
</div>
