<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TuneInDaily</title>
</head>
<body>
<div class="music-notes note1">♪</div>
    <div class="music-notes note2">♫</div>
    <div class="music-notes note3">♪</div>
    <div class="music-notes note4">♫</div>
    <div class="music-notes note5">♪</div>
    <div class="music-notes note6">♫</div>

    <div class="login-container">
        <h2>Login</h2>
        
        <div *ngIf="errorMessage" class="error-message">
            <strong>Error:</strong> {{ errorMessage }}
        </div>

<form (ngSubmit)="onLogin()" class="login-form">

  <!-- LOGIN STEP -->
  <div *ngIf="loginStep === 'login'">

    <div class="input-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      />
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        required
      />
    </div>

    <button type="submit" class="login-btn-main">
      Login
    </button>

  </div>

  <!-- MFA STEP -->
  <div *ngIf="loginStep === 'mfa'">

    <p class="mfa-instruction">
      Enter the 6-digit verification code sent to your email
    </p>
<br>
    <div class="input-group">
      <label for="mfaCode">Verification Code</label>
      <input
        type="text"
        id="mfaCode"
        name="mfaCode"
        [(ngModel)]="mfaCode"
        maxlength="6"
        placeholder="123456"
        required
      />
    </div>
    <button
      type="button"
      class="login-btn-main"
      (click)="verifyMfa()"
    >
      Verify
    </button>

  </div>

  <!-- ERROR MESSAGE -->
  <p *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </p>

</form>


 

        <div class="extra-links">
            <p>Forgot your password? <a href="#">Reset it</a></p>
            <p>New here? <a routerLink="/register">Create an account</a></p>
        </div>
    </div>

</body>
</html>
