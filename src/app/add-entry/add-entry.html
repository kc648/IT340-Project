<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneInDaily - New Entry</title>

</head>
<body>

    <!-- Main Content -->
    <div class="container">
        <div class="entry-form">
            <div class="icon-header">
                <div class="headphones-icon">🎧</div>
            </div>

            <h1>What did your day sound like today?</h1>
            <p class="subtitle">Type the sounds, songs, or moments that defined your day — short or long, it's your auditory snapshot.</p>

    <div class="form-group">
	<label>Date</label>
	<input type="text" class="input-field readonly" [value]="date | date:'fullDate'"readonly />
    </div>

    <div class="form-group">
      <label>Song title</label>
      <input
        type="text"
        [(ngModel)]="songTitle"
        name="songTitle"
        placeholder="e.g. Yellow"
      />
    </div>

    <div class="form-group">
      <label>Artist</label>
      <input
        type="text"
        [(ngModel)]="artist"
        name="artist"
        placeholder="e.g. Coldplay"
      />
    </div>

    <div class="form-group">
      <label>Your entry</label>
      <textarea
        [(ngModel)]="entryText"
        name="entryText"
        placeholder="e.g. morning rain on the window..."
      ></textarea>
    </div>

            <div class="form-footer">
                <p class="privacy-note">Add another entry to the soundtrack of your life.</p>
                <button class="save-btn" (click)="saveEntry()">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
